name: cubes

services:
  export-api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      BLENDER_BIN: blender
      # Must match the browser tab origin (host + port), not the API URL.
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
